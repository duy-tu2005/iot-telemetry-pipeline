# Local teaching/lab broker. Anonymous access is intentional here; the Docker
# port is bound to 127.0.0.1 by default in compose.yaml. Do not expose this
# configuration to an untrusted network.
per_listener_settings true
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
